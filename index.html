<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日晨报</title>
<style>
:root{--bg:#f7f7f9;--fg:#1d1d1f;--mut:#6b6b76;--card:#fff;--bd:#e3e3e8;--ac:#2f6fed;--chip:#eef2fd}
@media (prefers-color-scheme:dark){:root{--bg:#121216;--fg:#e8e8ec;--mut:#9a9aa6;--card:#1c1c22;--bd:#2c2c35;--ac:#7aa2ff;--chip:#24283a}}
:root[data-theme=light]{--bg:#f7f7f9;--fg:#1d1d1f;--mut:#6b6b76;--card:#fff;--bd:#e3e3e8;--ac:#2f6fed;--chip:#eef2fd}
:root[data-theme=dark]{--bg:#121216;--fg:#e8e8ec;--mut:#9a9aa6;--card:#1c1c22;--bd:#2c2c35;--ac:#7aa2ff;--chip:#24283a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:8px;justify-content:space-between}
h1{font-size:22px;margin:8px 0}a{color:var(--ac)}
button,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
input{width:100%;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:3px 12px;cursor:pointer;font-size:14px}
.chip.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0;color:inherit;text-decoration:none}
.card .d{font-weight:700}.card .m{color:var(--mut);font-size:13px}.card ol{margin:6px 0 0;padding-left:20px;font-size:15px}
.stats{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
.bars{display:flex;align-items:flex-end;gap:2px;height:70px}.bars div{flex:1;background:var(--ac);opacity:.75;border-radius:2px 2px 0 0}
.tags span{display:inline-block;margin:3px 6px 0 0;font-size:13px;color:var(--mut)}
article h2{font-size:18px;border-left:4px solid var(--ac);padding-left:8px;margin-top:24px}
article{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 16px 14px;word-break:break-word}
mark{background:#ffe58a;color:#000}.mut{color:var(--mut)}
details summary{cursor:pointer;color:var(--mut);font-size:14px}
</style></head><body><div class="wrap">
<header><h1><a href="#" style="color:inherit;text-decoration:none">📰 每日晨报</a></h1><button id="tg" title="切换深浅色">🌓</button></header>
<main id="app">加载中…</main>
<p class="mut" style="font-size:12px;text-align:center">AI / 大模型 · 跨行业 · 影视 · 开发者 · 产品建议 ｜ 自动发布</p>
</div><script>
const SECS=["AI / 大模型","跨行业重点","热门影视","个人开发者案例","产品建议"];
const $=s=>document.querySelector(s), esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let IDX=[], q="", sec="";
const root=document.documentElement, saved=localStorage.theme; if(saved) root.dataset.theme=saved;
$("#tg").onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;root.dataset.theme=localStorage.theme=dark?"light":"dark"};
function inline(s){s=esc(s);
 s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
 s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");return s}
function md(t){const out=[];let list=null;
 const close=()=>{if(list){out.push(`</${list}>`);list=null}};
 for(const raw of t.split("\n")){const l=raw.trim();let m;
  if(!l){continue}
  if(m=l.match(/^(#{1,4})\s+(.*)/)){close();out.push(`<h${m[1].length+1}>${inline(m[2])}</h${m[1].length+1}>`);continue}
  if(m=l.match(/^(\d+)[.、]\s+(.*)/)){if(list!=="ol"){close();out.push(`<ol start="${m[1]}">`);list="ol"}out.push(`<li>${inline(m[2])}`);continue}
  if(m=l.match(/^[-*]\s+(.*)/)){if(list!=="ul"){close();out.push("<ul>");list="ul"}out.push(`<li>${inline(m[1])}`);continue}
  if(list){out.push(`<br>${inline(l)}`);continue}
  out.push(`<p>${inline(l)}</p>`)}
 close();return out.join("")}
function hl(s){if(!q)return esc(s);return esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),m=>`<mark>${m}</mark>`)}
function stats(){const days=[...IDX].reverse(),mx=Math.max(...days.map(d=>d.items.length),1);
 const stop=new Set(["发布","推出","开源","正式","AI","模型","新","称","与","的","和"]),cnt={};
 IDX.slice(0,7).forEach(d=>d.items.forEach(it=>(it.title.match(/[A-Za-z][\w.\-]+|[\u4e00-\u9fa5]{2,4}/g)||[]).forEach(w=>{if(!stop.has(w))cnt[w]=(cnt[w]||0)+1})));
 const top=Object.entries(cnt).filter(e=>e[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,14);
 return `<details class="stats"><summary>📊 每日条数 · 近 7 天热词</summary>
 <div class="bars">${days.map(d=>`<div title="${d.date}：${d.items.length} 条" style="height:${d.items.length/mx*100}%"></div>`).join("")}</div>
 <div class="mut" style="font-size:12px;display:flex;justify-content:space-between"><span>${days[0]?.date||""}</span><span>${days.at(-1)?.date||""}</span></div>
 <div class="tags">${top.map(([w,n])=>`<span>#${esc(w)} ×${n}</span>`).join("")}</div></details>`}
function list(){
 const ql=q.toLowerCase();
 const rows=IDX.filter(d=>(!sec||d.counts[sec])&&(!ql||d.text.toLowerCase().includes(ql)));
 let h=`<input id="q" placeholder="搜索关键词，如 Grok、DeepSeek…" value="${esc(q)}">
 <div class="chips">${["",...SECS].map(s=>`<span class="chip ${s===sec?"on":""}" data-s="${s}">${s||"全部"}</span>`).join("")}</div>`+stats();
 h+=`<p class="mut">共 ${rows.length} 期</p>`;
 for(const d of rows){let titles=sec?d.items.filter(i=>i.section===sec).map(i=>i.title):d.highlights;
  if(ql){const hit=d.items.filter(i=>i.title.toLowerCase().includes(ql)&&(!sec||i.section===sec)).map(i=>i.title);if(hit.length)titles=hit}
  const c=Object.entries(d.counts).map(([k,v])=>`${k} ${v}`).join(" · ");
  h+=`<a class="card" href="#/${d.date}"><div class="d">${d.date}</div><div class="m">${esc(c)}</div><ol>${titles.slice(0,sec||ql?6:3).map(t=>`<li>${hl(t)}</li>`).join("")}</ol></a>`}
 $("#app").innerHTML=h;
 const inp=$("#q");inp.oninput=e=>{q=e.target.value.trim();list();const n=$("#q");n.focus();n.setSelectionRange(n.value.length,n.value.length)};
 document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{sec=c.dataset.s;list()});
}
async function detail(date){
 const i=IDX.findIndex(d=>d.date===date);
 $("#app").innerHTML="加载中…";
 const r=await fetch(`data/${date}.md`,{cache:"no-cache"});
 if(!r.ok){$("#app").innerHTML=`<p>找不到 ${esc(date)} 这一期。<a href="#">返回</a></p>`;return}
 const t=await r.text(), prev=IDX[i+1], next=IDX[i-1];
 const nav=`<p style="display:flex;justify-content:space-between"><a href="#">← 全部</a><span>${prev?`<a href="#/${prev.date}">‹ ${prev.date}</a>`:""} ${next?`<a href="#/${next.date}">${next.date} ›</a>`:""}</span></p>`;
 $("#app").innerHTML=nav+`<h2 style="margin:4px 0">${date}</h2><article>${md(t)}</article>`+nav;scrollTo(0,0)}
function route(){const m=location.hash.match(/^#\/(\d{4}-\d{2}-\d{2})/);m?detail(m[1]):list()}
fetch("data/index.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{IDX=j;route()}).catch(e=>$("#app").textContent="加载失败："+e);
addEventListener("hashchange",route);
</script></body></html>
